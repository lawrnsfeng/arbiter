[project]
name = "arbiter"
version = "0.2.0"
description = "Autonomous, evidence-gated multi-axis code review for Python, Go, Rust and TypeScript"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arbiter = "arbiter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
# rule examples violate on purpose and use undefined names; they are parsed, never run
extend-exclude = ["rulebook/python/*/bad.py", "rulebook/python/*/good.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH", "PERF", "FURB", "RUF", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity counts: judged in review, not by count
  "PLW1510",  # subprocess.run without check: return codes are inspected explicitly everywhere
  "PLC0415",  # local imports break import cycles (cli -> eval, pipeline -> report)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0917"]

[tool.mypy]
python_version = "3.13"
files = ["arbiter"]
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
