[project]
name = "arbiter"
version = "0.1.0"
description = "Autonomous, evidence-gated multi-axis code review for Python, Go, Rust and TypeScript"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arbiter = "arbiter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
